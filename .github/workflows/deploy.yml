# Deploy to Cloud Run — the Bank Assist pattern: triggered by CI succeeding
# on main, so unverified code never deploys. Required GitHub secrets:
# GCP_SA_KEY and GCP_PROJECT_ID, nothing else — every other value is
# discovered or lives in GCP Secret Manager.
# Setup (one-time, founder-side): docs/runbooks/gcp-staging-setup.md.
#
# Until those two secrets exist the job skips cleanly rather than failing,
# so main does not wear a red X for missing infrastructure.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Queue, never cancel: a deploy runs migrations against a live database
# (Bank Assist lesson — Cloud Run also aborts concurrent service updates).
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  REGION: us-east1
  SERVICE: olink-desk

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check GCP is configured
        id: gate
        env:
          HAS_KEY: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "GCP_SA_KEY / GCP_PROJECT_ID not set — skipping deploy (see docs/runbooks/gcp-staging-setup.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          ref: main

      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.skip == 'false'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.skip == 'false'

      # Idempotent, and it runs BEFORE the deploy so a revision never starts
      # expecting a model the project cannot serve. `services enable` is a
      # no-op when the API is already on.
      #
      # Deliberately NOT `|| exit 1`: a deployer service account without
      # serviceusage permission is a permissions question for a human, not a
      # reason to block a deploy of everything else. The service reports the
      # truth either way — GET /api/health probes Vertex and says whether it
      # actually answers, which is the only claim worth making.
      - name: Enable Vertex AI on the project
        if: steps.gate.outputs.skip == 'false'
        run: |
          gcloud services enable aiplatform.googleapis.com \
            --project "${{ secrets.GCP_PROJECT_ID }}" --quiet \
            || echo "::warning::Could not enable aiplatform.googleapis.com — enable it in the console, or grant the deployer roles/serviceusage.serviceUsageAdmin. AI drafting stays off until then."

      - name: Build and push image
        if: steps.gate.outputs.skip == 'false'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/olink-desk/app:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 20
          cache: pnpm

      - name: Run database migrations
        if: steps.gate.outputs.skip == 'false'
        run: |
          # Strip trailing whitespace AND a UTF-8 BOM — both have shipped a
          # broken DATABASE_URL in this fleet before, and both produce the
          # same useless parse error an empty string does.
          RAW="$(gcloud secrets versions access latest --secret=olink-desk-database-url)" || exit 1
          DATABASE_URL="$(printf '%s' "$RAW" | sed 's/^\xEF\xBB\xBF//' | tr -d '[:space:]')"
          [ -n "$DATABASE_URL" ] || { echo "DATABASE_URL secret is empty"; exit 1; }
          export DATABASE_URL
          pnpm install --frozen-lockfile
          pnpm --filter @olink-desk/database exec prisma migrate deploy

      - name: Deploy to Cloud Run
        if: steps.gate.outputs.skip == 'false'
        run: |
          # --set-secrets takes ONE comma-separated string and REPLACES the
          # whole set rather than merging. Dropping an entry takes that secret
          # off the revision; dropping DATABASE_URL means the instance fails to
          # start. Add to the string, never rewrite it.
          #
          # This comment lives above the command, not inside it: every line
          # below ends in a backslash, so a comment between them would be
          # joined to the previous line and split the command in two.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --port 8080 \
            --allow-unauthenticated \
            --min-instances 0 \
            --service-account "olink-desk-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},VERTEX_LOCATION=us-central1" \
            --set-secrets "DATABASE_URL=olink-desk-database-url:latest,JWT_SECRET=olink-desk-jwt-secret:latest,CHANNEL_CONFIG_KEY=olink-desk-channel-config-key:latest,DESK_ADMIN_SECRET=olink-desk-admin-secret:latest,CRON_SECRET=olink-desk-cron-secret:latest" \
            --quiet

      - name: Set APP_BASE_URL from the service URL
        if: steps.gate.outputs.skip == 'false'
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "${{ secrets.GCP_PROJECT_ID }}" --format 'value(status.url)')" || exit 1
          # --update-env-vars MERGES; --set-env-vars would silently wipe the
          # rest of the environment (Bank Assist lesson, verbatim).
          gcloud run services update "$SERVICE" \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --update-env-vars "APP_BASE_URL=$URL" \
            --quiet
          echo "Deployed: $URL"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      # A deploy is not done until the running revision proves itself. The
      # runner CAN reach the service, so this is where breakage gets caught
      # and named — never by whoever opens the product first.
      - name: Post-deploy smoke test
        if: steps.gate.outputs.skip == 'false'
        run: |
          echo "Probing $SERVICE_URL/api/health"
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$SERVICE_URL/api/health" || true)
            body=$(cat /tmp/health.json 2>/dev/null || echo '(no body)')
            echo "attempt $i: HTTP $code  $body"
            if [ "$code" = "200" ]; then
              echo "Deploy healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deploy is UNHEALTHY — failing the run. Last response above names the broken component."
          exit 1
